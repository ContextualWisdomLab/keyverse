name: Publish verified LDAP reconciliation hardening

on:
  push:
    branches:
      - fix/ldap-directory-reconciliation-hardening
    paths:
      - .github/workflows/one-shot-publish-ldap-hardening.yml
      - scripts/ci/ldap-hardening.part-*

permissions:
  contents: write

concurrency:
  group: one-shot-publish-ldap-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-verify-and-publish:
    if: >-
      github.repository == 'ContextualWisdomLab/keyverse'
      && github.ref == 'refs/heads/fix/ldap-directory-reconciliation-hardening'
      && github.actor == 'seonghobae'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Check out the exact hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/ldap-directory-reconciliation-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up the locked package runner
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Verify and apply the exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          encoded="${RUNNER_TEMP}/ldap-hardening.patch.gz.b64"
          decoded="${RUNNER_TEMP}/ldap-hardening.patch"
          cat scripts/ci/ldap-hardening.part-* >"$encoded"
          printf '%s  %s\n' \
            'cb7b5c7ab1d4109f9d8dbf576f0013cca1b9cecd472a99baabcd9cb7df943908' \
            "$encoded" | sha256sum -c -
          base64 --decode "$encoded" | gzip --decompress >"$decoded"
          printf '%s  %s\n' \
            '342c8db3fc0c44f84bdb79e9a02efa3c9f8c5bbe2ef10265792e77dd8b987ebf' \
            "$decoded" | sha256sum -c -
          git apply --check "$decoded"
          git apply "$decoded"
          rm -f \
            scripts/ci/ldap-hardening.part-* \
            scripts/ci/ldap-hardening.patch.gz.b64 \
            .github/workflows/one-shot-publish-ldap-hardening.yml
          git diff --check

      - name: Install locked dependencies
        working-directory: services/account_unification
        run: uv sync --locked --extra dev

      - name: Verify service quality and complete production coverage
        working-directory: services/account_unification
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check app tests tools
          uv run interrogate .
          uv run python -m compileall -q app tests tools
          uv run coverage erase
          uv run coverage run --branch --source=app -m pytest -q
          uv run coverage report --show-missing --fail-under=100
          uv build --out-dir dist

      - name: Verify deployment contracts
        env:
          IDP_DB_PASSWORD: ci-placeholder
          IDP_BOOTSTRAP_ADMIN_PASSWORD: ci-placeholder
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_realm.py deploy/keycloak/realm-cwl.json
          docker compose -f docker-compose.yml config >/dev/null
          while IFS= read -r -d '' template; do
            python -m json.tool "$template" >/dev/null
          done < <(find deploy/templates -maxdepth 1 -type f -name '*.json' -print0)
          git diff --check

      - name: Commit and push the verified hardening tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::Verified LDAP hardening produced no final change.'
            exit 1
          fi
          git commit -m 'fix(federation): harden LDAP reconciliation lifecycle'
          git push origin HEAD:fix/ldap-directory-reconciliation-hardening
