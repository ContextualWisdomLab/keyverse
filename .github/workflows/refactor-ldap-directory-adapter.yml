name: Refactor LDAP directory component adapter

on:
  push:
    branches:
      - feat/ldap-directory-desired-state
    paths:
      - scripts/ci/refactor_ldap_directory_adapter.py
      - .github/workflows/refactor-ldap-directory-adapter.yml

permissions:
  contents: write

concurrency:
  group: refactor-ldap-directory-adapter
  cancel-in-progress: false

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ldap-directory-desired-state
          fetch-depth: 0

      - name: Materialize typed protocol and adapter methods
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/refactor_ldap_directory_adapter.py
          python -m compileall -q \
            services/account_unification/app/product_keycloak_client.py \
            services/account_unification/tests/mock_product_keycloak.py

      - name: Remove one-shot control files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/refactor-ldap-directory-adapter.yml \
            scripts/ci/refactor_ldap_directory_adapter.py

      - name: Commit the refactored tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(directory): declare typed component adapter methods"
          git push origin HEAD:feat/ldap-directory-desired-state
