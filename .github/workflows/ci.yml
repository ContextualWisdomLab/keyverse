name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded evidence for the same pull request or branch. This keeps the
# runner queue bounded during review-fix loops while preserving the newest head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege default token (OSSF Scorecard: Token-Permissions).
permissions:
  contents: read

jobs:
  finalize-hourly-nvidia-loop:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.head_ref == 'feat/hourly-product-development-loop'
      && github.actor == 'seonghobae'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/hourly-product-development-loop
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up the locked package runner
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Apply the reviewed reconciliation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path(".github/workflows/hourly-product-development.yml")
          content = path.read_text(encoding="utf-8")
          for job_name in ("develop-product-gap", "reverify-product-gap"):
              marker = f"  {job_name}:\n"
              start = content.index(marker)
              tail = content[start + len(marker) :]
              next_job = re.search(r"(?m)^  [a-z0-9-]+:\n", tail)
              end = (
                  len(content)
                  if next_job is None
                  else start + len(marker) + next_job.start()
              )
              job = content[start:end]
              block_marker = "          allowed-endpoints: |\n"
              block_start = job.index(block_marker) + len(block_marker)
              block_end = job.find("\n\n      - name:", block_start)
              if block_end == -1:
                  raise SystemExit(
                      f"{job_name}: endpoint block terminator is missing"
                  )
              lines = job[block_start:block_end].rstrip("\n").splitlines()
              exact_endpoints = {line.strip() for line in lines if line.strip()}
              for endpoint in (
                  "files.pythonhosted.org:443",
                  "pypi.org:443",
              ):
                  if endpoint not in exact_endpoints:
                      lines.append(f"            {endpoint}")
              new_block = "\n".join(lines) + "\n"
              new_job = job[:block_start] + new_block + job[block_end:]
              content = content[:start] + new_job + content[end:]
          path.write_text(content, encoding="utf-8")
          PY
          git diff --check

      - name: Verify focused scheduler boundaries
        working-directory: services/account_unification
        run: |
          set -euo pipefail
          uv sync --locked --extra dev
          uv run pytest -q \
            tests/test_hourly_product_development.py \
            tests/test_hourly_product_guard.py \
            tests/test_nim_proxy.py

      - name: Verify complete service and production coverage
        working-directory: services/account_unification
        run: |
          set -euo pipefail
          uv run ruff check app tests tools
          uv run interrogate .
          uv run python -m compileall -q app tests tools
          uv run coverage erase
          uv run coverage run --branch --source=app -m pytest -q
          uv run coverage report --show-missing --fail-under=100
          uv build --out-dir dist

      - name: Verify workflow and deployment contracts
        env:
          IDP_DB_PASSWORD: ci-placeholder
          IDP_BOOTSTRAP_ADMIN_PASSWORD: ci-placeholder
        run: |
          set -euo pipefail
          python scripts/ci/hourly_product_guard.py self-test
          grep -F 'NVIDIA_NIM_API_KEY' .github/workflows/hourly-product-development.yml >/dev/null
          grep -F 'OPENCODE_PRODUCT_DEVELOPMENT_TOKEN' .github/workflows/hourly-product-development.yml >/dev/null
          if grep -R -E 'COPILOT_GITHUB_TOKEN|/agents/repos/' \
            .github/workflows/hourly-product-development.yml \
            README.md CHANGELOG.md docs/operations/hourly-product-development.md \
            docs/superpowers/specs/2026-08-04-keyverse-hourly-product-development-design.md \
            docs/superpowers/plans/2026-08-04-keyverse-hourly-product-development.md \
            docs/doctoring/hourly-opencode-product-development.md; then
            echo '::error::Superseded Copilot Agent Tasks contract remains.'
            exit 1
          fi
          python scripts/validate_realm.py deploy/keycloak/realm-cwl.json
          docker compose -f docker-compose.yml config >/dev/null
          while IFS= read -r -d '' template; do
            python -m json.tool "$template" >/dev/null
          done < <(find deploy/templates -maxdepth 1 -type f -name '*.json' -print0)
          git diff --check

      - name: Remove temporary reconciliation artifacts and restore canonical CI
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/bootstrap-finalize-opencode-product-loop.yml \
            .github/workflows/bootstrap-finalize-opencode-v3.yml \
            .github/workflows/bootstrap-finalize-opencode-v4.yml \
            .github/workflows/bootstrap-reconcile-opencode-product-loop.yml \
            scripts/ci/finalize_opencode_product_loop.py \
            scripts/ci/reconcile_opencode_product_loop.py
          git fetch --no-tags origin main
          git show origin/main:.github/workflows/ci.yml >.github/workflows/ci.yml
          git diff --check

      - name: Commit the exact verified scheduler
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::Final reconciliation produced no change.'
            exit 1
          fi
          git commit -m 'ci: finalize hourly NVIDIA NIM OpenCode development'
          git push origin HEAD:feat/hourly-product-development-loop

  account-unification-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/account_unification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # v9 changed this default to false; retain bounded cache usage.
          prune-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check app tests tools
      - name: Docstrings
        run: uv run interrogate .
      - name: Test and enforce production coverage
        run: |
          uv run coverage run --branch --source=app -m pytest -q
          uv run coverage report --show-missing --fail-under=100

  realm-config-validates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate Keycloak realm config-as-code
        run: python scripts/validate_realm.py deploy/keycloak/realm-cwl.json

  compose-config-validates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml config >/dev/null
        env:
          IDP_DB_PASSWORD: ci-placeholder
          IDP_BOOTSTRAP_ADMIN_PASSWORD: ci-placeholder
