name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded evidence for the same pull request or branch. This keeps the
# runner queue bounded during review-fix loops while preserving the newest head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege default token (OSSF Scorecard: Token-Permissions).
permissions:
  contents: read

jobs:
  account-unification-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/account_unification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Keep cache pruning enabled to bound runner disk usage.
          prune-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Verify uv lock dependency metadata
        run: uv pip check
      - name: Verify exported hash lock
        run: |
          exported_requirements="${RUNNER_TEMP}/keyverse-requirements-dev.txt"
          tracked_requirements_body="${RUNNER_TEMP}/keyverse-tracked-requirements-body.txt"
          exported_requirements_body="${RUNNER_TEMP}/keyverse-exported-requirements-body.txt"
          uv export \
            --locked \
            --format requirements.txt \
            --extra dev \
            --no-emit-project \
            --output-file "${exported_requirements}"

          # uv records the chosen output path in its two-line generated-file
          # header. Compare the package graph and hashes while ignoring only
          # that environment-specific provenance text.
          tail -n +3 requirements-dev.txt > "${tracked_requirements_body}"
          tail -n +3 "${exported_requirements}" > "${exported_requirements_body}"
          cmp --silent "${tracked_requirements_body}" "${exported_requirements_body}" || {
            diff --unified "${tracked_requirements_body}" "${exported_requirements_body}"
            exit 1
          }

          export_lock_venv="${RUNNER_TEMP}/keyverse-export-lock"
          uv venv "${export_lock_venv}"
          VIRTUAL_ENV="${export_lock_venv}" uv pip install \
            --require-hashes \
            -r requirements-dev.txt
          VIRTUAL_ENV="${export_lock_venv}" uv pip check
      - name: Lint
        run: uv run ruff check app tests tools
      - name: Docstrings
        run: uv run interrogate .
      - name: Compile Python sources
        run: uv run python -m compileall -q app tests tools
      - name: Test repository documentation contracts
        working-directory: ${{ github.workspace }}
        run: uv run --locked --project services/account_unification --extra dev pytest tests/test_documentation_contract.py -q
      - name: Test and enforce production coverage
        run: |
          uv run coverage run --branch --source=app -m pytest -q
          uv run coverage report --show-missing --fail-under=100
      - name: Build distribution
        run: uv build --out-dir dist

  realm-config-validates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate Keycloak realm config-as-code
        run: python scripts/validate_realm.py deploy/keycloak/realm-cwl.json
      - name: Validate deployment template JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("deploy/templates").glob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
          PY

  compose-config-validates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml config >/dev/null
        env:
          IDP_DB_PASSWORD: ci-placeholder
          IDP_BOOTSTRAP_ADMIN_PASSWORD: ci-placeholder
