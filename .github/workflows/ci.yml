name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default token (OSSF Scorecard: Token-Permissions).
permissions:
  contents: read

jobs:
  account-unification-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/account_unification
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check app tests tools
      - name: Docstrings
        run: uv run interrogate .
      - name: Test
        run: uv run pytest -q

  realm-config-validates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Validate Keycloak realm config-as-code
        run: python scripts/validate_realm.py deploy/keycloak/realm-cwl.json

  compose-config-validates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml config >/dev/null
        env:
          IDP_DB_PASSWORD: ci-placeholder
          IDP_BOOTSTRAP_ADMIN_PASSWORD: ci-placeholder
