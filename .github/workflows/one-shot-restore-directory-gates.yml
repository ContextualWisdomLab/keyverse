name: Restore directory reconciliation gates

on:
  push:
    branches:
      - fix/restore-directory-reconciliation-gates
    paths:
      - .github/workflows/one-shot-restore-directory-gates.yml

permissions:
  contents: write

concurrency:
  group: one-shot-restore-directory-gates
  cancel-in-progress: true

jobs:
  apply-verify-and-publish:
    if: >-
      github.repository == 'ContextualWisdomLab/keyverse'
      && github.ref == 'refs/heads/fix/restore-directory-reconciliation-gates'
      && github.actor == 'seonghobae'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Check out the exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/restore-directory-reconciliation-gates
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while read -r expected_sha expected_size path; do
            actual_sha="$(sha256sum "$path" | cut -d' ' -f1)"
            actual_size="$(wc -c <"$path" | tr -d ' ')"
            printf '%s expected_size=%s actual_size=%s expected_sha=%s actual_sha=%s\n' \
              "$path" "$expected_size" "$actual_size" "$expected_sha" "$actual_sha"
            if [ "$actual_sha" != "$expected_sha" ] || [ "$actual_size" != "$expected_size" ]; then
              failed=1
            fi
          done <<'PARTS'
          5d6db463e51169f0aa9eba3d18126460d4493b00264c82285f666a3d011ca21a 4000 scripts/ci/directory-gates.part-00
          a003d132d0cc01053af0ac4e8e9b1e6bbbedf7dfd77f0ca1582d68acbb940e65 4000 scripts/ci/directory-gates.part-01
          38089984d7573a8cf2503534313a9de09ffe42ede0518a07b0ae86abcaa3eb34 4000 scripts/ci/directory-gates.part-02
          0af80816db89d7ea6e7f9881b91e5e0026cf80e6235451ca371afdff6d55190e 4000 scripts/ci/directory-gates.part-03
          2c08048a744dcfd86ce8e0b448555758c09dc42c308cc4973ff8cb5d48d2d480 4000 scripts/ci/directory-gates.part-04
          6acc14c5e741ce2118fe80a5b7dc76f6b452a37f2cc19558ebdb82024a0732dd 4000 scripts/ci/directory-gates.part-05
          dc575ce32d82c3a9222ebb200be8df5106ad276afb4b90505ea92e9b9a81f2a5 4000 scripts/ci/directory-gates.part-06
          43f087ca6ce75f36f94f193bbd6696e6500f55371d143bfad983a7206993c501 208 scripts/ci/directory-gates.part-07
          PARTS
          if [ "$failed" -ne 0 ]; then
            echo '::error::One or more directory repair payload parts differ from the reviewed bytes.'
            exit 1
          fi

          encoded="${RUNNER_TEMP}/directory-gates.patch.gz.b64"
          decoded="${RUNNER_TEMP}/directory-gates.patch"
          cat scripts/ci/directory-gates.part-* >"$encoded"
          echo "aggregate_size=$(wc -c <"$encoded" | tr -d ' ') aggregate_sha=$(sha256sum "$encoded" | cut -d' ' -f1)"
          printf '%s  %s\n' \
            '36a1d20ec5af99fd4d6282ff29101046c6188c61149520ae95362434f365f5df' \
            "$encoded" | sha256sum -c -
          base64 --decode "$encoded" | gzip --decompress >"$decoded"
          echo "decoded_size=$(wc -c <"$decoded" | tr -d ' ') decoded_sha=$(sha256sum "$decoded" | cut -d' ' -f1)"
          printf '%s  %s\n' \
            '2cb05e22fc1b615a30e8c22e832366e733d22cbde20be661b57d3d8c72d6eb6f' \
            "$decoded" | sha256sum -c -
          git apply --check --verbose "$decoded"
          git apply "$decoded"
          rm -f scripts/ci/directory-gates.part-*
          rm -f .github/workflows/one-shot-restore-directory-gates.yml
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up the pinned package runner
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'
          prune-cache: true

      - name: Install locked dependencies
        working-directory: services/account_unification
        run: uv sync --locked --extra dev

      - name: Verify service quality and production coverage
        working-directory: services/account_unification
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check app tests tools
          uv run interrogate .
          uv run python -m compileall -q app tests tools
          uv run coverage erase
          uv run coverage run --branch --source=app -m pytest -q
          uv run coverage report --show-missing --fail-under=100
          uv build --out-dir dist

      - name: Verify deployment contracts
        env:
          IDP_DB_PASSWORD: ci-placeholder
          IDP_BOOTSTRAP_ADMIN_PASSWORD: ci-placeholder
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_realm.py deploy/keycloak/realm-cwl.json
          docker compose -f docker-compose.yml config >/dev/null
          while IFS= read -r -d '' template; do
            python -m json.tool "$template" >/dev/null
          done < <(find deploy/templates -maxdepth 1 -type f -name '*.json' -print0)
          git diff --check

      - name: Commit and push the exact verified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(federation): restore directory reconciliation gates'
          git push origin HEAD:fix/restore-directory-reconciliation-gates
