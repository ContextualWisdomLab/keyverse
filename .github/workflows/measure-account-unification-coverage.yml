name: Measure account-unification coverage

on:
  push:
    branches:
      - feat/federation-preflight-validation
    paths:
      - .github/workflows/measure-account-unification-coverage.yml
      - services/account_unification/app/**
      - services/account_unification/tests/**

permissions:
  contents: read

concurrency:
  group: measure-account-unification-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    if: >-
      github.repository == 'ContextualWisdomLab/keyverse'
      && github.ref == 'refs/heads/feat/federation-preflight-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit

      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up package runner
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          prune-cache: true

      - name: Install locked project dependencies
        working-directory: services/account_unification
        run: uv sync --locked --extra dev

      - name: Measure statement and branch coverage
        working-directory: services/account_unification
        run: |
          set -euo pipefail
          uv run --with coverage==7.14.3 \
            coverage run --branch --source=app -m pytest -q
          uv run --with coverage==7.14.3 \
            coverage report --show-missing --skip-covered --fail-under=100
