name: Repair OIDC finalizer v3

on:
  push:
    branches:
      - feat/oidc-rp-client-preflight
    paths:
      - .github/workflows/one-shot-repair-oidc-finalizer-v3.yml

permissions:
  contents: read

concurrency:
  group: one-shot-finalize-oidc-rp-preflight
  cancel-in-progress: true

jobs:
  repair-and-retrigger:
    if: >-
      github.repository == 'ContextualWisdomLab/keyverse'
      && github.ref == 'refs/heads/feat/oidc-rp-client-preflight'
      && github.actor == 'seonghobae'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/oidc-rp-client-preflight
          fetch-depth: 0
          persist-credentials: true

      - name: Remove the finalizer script defect
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              '.github/workflows/one-shot-finalize-oidc-rp-preflight-v2.yml'
          )
          if path.exists():
              content = path.read_text(encoding='utf-8')
              old = 'insert_at = max(cast(int, node.end_lineno) for node in imports)'
              new = 'insert_at = max((node.end_lineno or 0) for node in imports)'
              if old in content:
                  content = content.replace(old, new, 1)
                  path.write_text(content, encoding='utf-8')
              elif new not in content:
                  raise SystemExit('OIDC finalizer import-anchor expression is missing')
          PY
          rm -f .github/workflows/one-shot-repair-oidc-finalizer-v3.yml
          git diff --check

      - name: Publish the corrected finalizer trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m 'ci: repair OIDC finalizer import anchoring'
          git push origin HEAD:feat/oidc-rp-client-preflight
