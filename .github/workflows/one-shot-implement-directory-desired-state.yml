name: One-shot LDAP desired-state implementation

on:
  push:
    branches:
      - feat/ldap-directory-desired-state
    paths:
      - .github/workflows/one-shot-implement-directory-desired-state.yml
      - scripts/ci/implement_directory_desired_state.py

permissions:
  contents: write

concurrency:
  group: one-shot-directory-desired-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement-and-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/keyverse'
      && github.ref == 'refs/heads/feat/ldap-directory-desired-state'
      && github.actor == 'seonghobae'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ldap-directory-desired-state
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up the locked package runner
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Install locked dependencies
        working-directory: services/account_unification
        run: uv sync --locked --extra dev

      - name: Expand behavior tests and verify RED
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/implement_directory_desired_state.py tests
          git diff --check
          set +e
          (
            cd services/account_unification
            uv run pytest -q tests/test_directory_federation_desired_state.py
          ) >"${RUNNER_TEMP}/directory-red.log" 2>&1
          red_status=$?
          set -e
          if [ "$red_status" -eq 0 ]; then
            echo '::error::Desired-state tests unexpectedly passed before production implementation.'
            exit 1
          fi
          if ! grep -E 'ImportError|cannot import name|AttributeError' \
            "${RUNNER_TEMP}/directory-red.log" >/dev/null; then
            cat "${RUNNER_TEMP}/directory-red.log"
            echo '::error::Focused RED did not fail for the expected missing production contract.'
            exit 1
          fi
          echo 'Verified focused RED for the missing desired-state production surface.'

      - name: Implement the reviewed production contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/implement_directory_desired_state.py production
          git diff --check

      - name: Verify focused behavior
        working-directory: services/account_unification
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/test_directory_federation_desired_state.py \
            tests/test_full_coverage_http_clients.py \
            tests/test_directory_federation_preflight.py \
            tests/test_directory_federation_secret_errors.py

      - name: Verify complete service and production quality
        working-directory: services/account_unification
        run: |
          set -euo pipefail
          uv run ruff check app tests tools
          uv run interrogate .
          uv run python -m compileall -q app tests tools
          uv run coverage erase
          uv run coverage run --branch --source=app -m pytest -q
          uv run coverage report --show-missing --fail-under=100
          uv build --out-dir dist

      - name: Verify deployment contracts
        env:
          IDP_DB_PASSWORD: ci-placeholder
          IDP_BOOTSTRAP_ADMIN_PASSWORD: ci-placeholder
        run: |
          set -euo pipefail
          python scripts/validate_realm.py deploy/keycloak/realm-cwl.json
          docker compose -f docker-compose.yml config >/dev/null
          while IFS= read -r -d '' template; do
            python -m json.tool "$template" >/dev/null
          done < <(find deploy/templates -maxdepth 1 -type f -name '*.json' -print0)
          git diff --check

      - name: Commit the exact verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            services/account_unification/app/directory_federation.py \
            services/account_unification/app/main.py \
            services/account_unification/app/product_keycloak_client.py \
            services/account_unification/tests/mock_product_keycloak.py \
            services/account_unification/tests/test_directory_federation_desired_state.py \
            services/account_unification/tests/test_full_coverage_http_clients.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::LDAP desired-state implementation produced no verified change.'
            exit 1
          fi
          git commit -m 'feat(federation): reconcile LDAP directory desired state'
          git push origin HEAD:feat/ldap-directory-desired-state
