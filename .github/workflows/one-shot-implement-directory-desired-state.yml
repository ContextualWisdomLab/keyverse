name: One-shot LDAP desired-state source snapshot

on:
  push:
    branches:
      - feat/ldap-directory-desired-state
    paths:
      - .github/workflows/one-shot-implement-directory-desired-state.yml

permissions:
  contents: read

concurrency:
  group: one-shot-directory-source-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    if: >-
      github.repository == 'ContextualWisdomLab/keyverse'
      && github.ref == 'refs/heads/feat/ldap-directory-desired-state'
      && github.actor == 'seonghobae'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ldap-directory-desired-state
          fetch-depth: 1
          persist-credentials: false

      - name: Package the exact source tree
        shell: bash
        run: |
          set -euo pipefail
          snapshot_dir="${RUNNER_TEMP}/keyverse-source"
          mkdir -p "$snapshot_dir"
          git rev-parse HEAD >"$snapshot_dir/head-sha.txt"
          git archive --format=tar.gz \
            --output="$snapshot_dir/keyverse-source.tar.gz" \
            HEAD
          sha256sum "$snapshot_dir/keyverse-source.tar.gz" \
            >"$snapshot_dir/keyverse-source.tar.gz.sha256"

      - name: Upload the exact source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ldap-desired-state-source-${{ github.run_id }}
          path: ${{ runner.temp }}/keyverse-source/
          if-no-files-found: error
          retention-days: 1
