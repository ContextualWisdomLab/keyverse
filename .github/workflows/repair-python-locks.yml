name: repair-python-locks-one-shot

on:
  push:
    branches:
      - fix/dependabot-coupled-lock-groups

permissions:
  contents: write

concurrency:
  group: repair-python-locks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-locks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/account_unification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dependabot-coupled-lock-groups
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true
      - name: Regenerate and verify both lock representations
        run: |
          uv lock
          uv export \
            --locked \
            --format requirements.txt \
            --extra dev \
            --no-emit-project \
            --output-file requirements-dev.txt
          uv sync --locked --extra dev
          uv pip check
      - name: Commit verified lock repair and remove this workflow
        working-directory: .
        run: |
          rm .github/workflows/repair-python-locks.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/repair-python-locks.yml \
            services/account_unification/uv.lock \
            services/account_unification/requirements-dev.txt
          git diff --cached --quiet && {
            echo "Expected a lock repair or one-shot workflow removal" >&2
            exit 1
          }
          git commit -m "build: regenerate Python dependency locks"
          git push origin HEAD:fix/dependabot-coupled-lock-groups
