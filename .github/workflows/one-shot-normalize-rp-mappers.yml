name: One-shot normalize RP mapper observations
# Retry after expanding reachable-branch coverage.

on:
  push:
    branches:
      - feat/oidc-rp-claim-profile
    paths:
      - .github/workflows/one-shot-normalize-rp-mappers.yml

permissions:
  contents: write

concurrency:
  group: one-shot-normalize-rp-mappers
  cancel-in-progress: false

jobs:
  red-green-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/oidc-rp-claim-profile
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install locked dependencies
        working-directory: services/account_unification
        run: uv sync --locked --extra dev

      - name: Verify the mapper-order regression is RED
        working-directory: services/account_unification
        shell: bash
        run: |
          set +e
          uv run pytest -q \
            tests/test_relying_party_mapper_reconciliation.py::test_generated_mapper_ids_and_vendor_order_do_not_create_false_drift
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected mapper normalization regression to fail before implementation" >&2
            exit 1
          fi

      - name: Implement mapper observation normalization
        run: python3 scripts/ci/one_shot_normalize_rp_mappers.py

      - name: Verify focused and complete production contracts
        working-directory: services/account_unification
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q tests/test_relying_party_mapper_reconciliation.py
          uv run ruff check app tests tools
          uv run interrogate .
          uv run coverage erase
          uv run coverage run --branch --source=app -m pytest -q
          uv run coverage report --show-missing --fail-under=100
          uv run python -m compileall -q app tests tools
          uv build --out-dir dist

      - name: Commit verified implementation and remove one-shot artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-normalize-rp-mappers.yml
          rm scripts/ci/one_shot_normalize_rp_mappers.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/account_unification/app/relying_party_state.py \
            .github/workflows/one-shot-normalize-rp-mappers.yml \
            scripts/ci/one_shot_normalize_rp_mappers.py
          git commit -m "fix(clients): normalize observed RP mapper state"
          git push origin HEAD:feat/oidc-rp-claim-profile
