name: Bootstrap OIDC federation preflight

on:
  push:
    branches:
      - feat/oidc-federation-preflight
    paths:
      - scripts/ci/apply_oidc_federation_preflight.py
      - scripts/ci/patch_oidc_legacy_test.py
      - .github/workflows/bootstrap-oidc-federation-preflight.yml

permissions:
  contents: read

concurrency:
  group: bootstrap-oidc-federation-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement:
    if: >-
      github.repository == 'ContextualWisdomLab/keyverse'
      && github.ref == 'refs/heads/feat/oidc-federation-preflight'
      && github.actor == 'seonghobae'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/oidc-federation-preflight
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up package runner
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Install the locked test environment
        working-directory: services/account_unification
        run: uv sync --locked --extra dev

      - name: Prove the missing OIDC policy is RED
        working-directory: services/account_unification
        run: |
          set -euo pipefail
          red_log="${RUNNER_TEMP}/oidc-red.log"
          set +e
          uv run pytest -q \
            tests/test_oidc_federation_preflight.py::test_oidc_put_rejects_invalid_configuration_before_mutation \
            >"$red_log" 2>&1
          red_status=$?
          set -e
          cat "$red_log"
          if [ "$red_status" -eq 0 ]; then
            echo '::error::The OIDC rejection test unexpectedly passed before implementation.'
            exit 1
          fi
          grep -F 'DID NOT RAISE' "$red_log" >/dev/null

      - name: Apply the reviewed production implementation
        run: |
          set -euo pipefail
          implementation_blob="$(git hash-object scripts/ci/apply_oidc_federation_preflight.py)"
          legacy_test_blob="$(git hash-object scripts/ci/patch_oidc_legacy_test.py)"
          test "$implementation_blob" = 'fa1e315fce62f7d3a8ba4ad837b554e379f20cba'
          test "$legacy_test_blob" = '0a78d97398835d98f0c37d9813ea6dea301e6913'
          python -m py_compile \
            scripts/ci/apply_oidc_federation_preflight.py \
            scripts/ci/patch_oidc_legacy_test.py
          python scripts/ci/apply_oidc_federation_preflight.py
          python scripts/ci/patch_oidc_legacy_test.py
          git diff --check

      - name: Verify focused OIDC federation behavior
        working-directory: services/account_unification
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/test_oidc_federation_preflight.py \
            tests/test_federation_preflight.py

      - name: Verify the complete service and quality gates
        working-directory: services/account_unification
        run: |
          set -euo pipefail
          uv run ruff check app tests tools
          uv run interrogate .
          uv run python -m compileall -q app tests tools
          uv run coverage erase
          uv run coverage run --branch --source=app -m pytest -q
          uv run coverage report --show-missing --fail-under=100
          uv build --out-dir dist

      - name: Verify documentation and deployment contracts
        env:
          IDP_DB_PASSWORD: ci-placeholder
          IDP_BOOTSTRAP_ADMIN_PASSWORD: ci-placeholder
        run: |
          set -euo pipefail
          python scripts/validate_realm.py deploy/keycloak/realm-cwl.json
          docker compose -f docker-compose.yml config >/dev/null
          python -m json.tool deploy/templates/saml-idp-employer-adfs.json >/dev/null
          python -m json.tool deploy/templates/oidc-idp-partner.json >/dev/null
          python - <<'PY'
          from pathlib import Path

          output_directory = Path("${{ runner.temp }}") / "keyverse-oidc-doc-shell"
          output_directory.mkdir(parents=True, exist_ok=True)
          for document_path in (
              Path("deploy/templates/README.md"),
              Path("docs/federation-onboarding.md"),
          ):
              inside = False
              block_lines: list[str] = []
              block_number = 0
              for line in document_path.read_text(encoding="utf-8").splitlines():
                  if line.strip() == "```bash":
                      inside = True
                      block_lines = []
                      continue
                  if inside and line.strip() == "```":
                      block_number += 1
                      output_path = output_directory / (
                          f"{document_path.stem}-{block_number}.sh"
                      )
                      output_path.write_text(
                          "\n".join(block_lines) + "\n", encoding="utf-8"
                      )
                      inside = False
                      continue
                  if inside:
                      block_lines.append(line)
              if inside:
                  raise SystemExit(f"unterminated bash block in {document_path}")
          PY
          find "${{ runner.temp }}/keyverse-oidc-doc-shell" \
            -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n
          git diff --check

      - name: Remove the one-shot implementation material
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-oidc-federation-preflight.yml
          rm scripts/ci/apply_oidc_federation_preflight.py
          rm scripts/ci/patch_oidc_legacy_test.py
          git diff --check

      - name: Commit the exact verified OIDC implementation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::OIDC preflight materializer produced no change.'
            exit 1
          fi
          git commit -m 'feat(federation): fail closed on unsafe OIDC providers'
          git push origin HEAD:feat/oidc-federation-preflight
