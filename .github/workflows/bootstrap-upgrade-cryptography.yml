name: Bootstrap cryptography security upgrade

on:
  push:
    branches:
      - feat/federation-preflight-validation
    paths:
      - .github/workflows/bootstrap-upgrade-cryptography.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-cryptography-security-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    if: >-
      github.repository == 'ContextualWisdomLab/keyverse'
      && github.ref == 'refs/heads/feat/federation-preflight-validation'
      && github.actor == 'seonghobae'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/federation-preflight-validation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up package runner
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          prune-cache: true

      - name: Upgrade the vulnerable X.509 parser dependency
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          project_path = Path("services/account_unification/pyproject.toml")
          project = project_path.read_text(encoding="utf-8")
          old_dependency = '    "cryptography==49.0.0",\n'
          new_dependency = '    "cryptography==50.0.0",\n'
          if project.count(old_dependency) != 1:
              raise SystemExit("expected exactly one cryptography 49.0.0 dependency")
          project_path.write_text(
              project.replace(old_dependency, new_dependency, 1),
              encoding="utf-8",
          )

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          anchor = (
              "### Fixed\n\n"
              "- Converted the employer ADFS template from an incompatible raw Keycloak\n"
          )
          replacement = (
              "### Fixed\n\n"
              "- Upgraded `cryptography` to 50.0.0 to remediate CVE-2026-69247 while\n"
              "  retaining the supported DER X.509 certificate parsing API.\n"
              "- Converted the employer ADFS template from an incompatible raw Keycloak\n"
          )
          if changelog.count(anchor) != 1:
              raise SystemExit("expected one changelog Fixed-section anchor")
          changelog_path.write_text(
              changelog.replace(anchor, replacement, 1),
              encoding="utf-8",
          )
          PY

      - name: Refresh exact dependency locks
        working-directory: services/account_unification
        run: |
          set -euo pipefail
          uv lock
          uv export \
            --format requirements.txt \
            --no-dev \
            --no-emit-project \
            --output-file requirements.lock
          uv export \
            --format requirements.txt \
            --extra dev \
            --no-emit-project \
            --output-file requirements-dev.txt
          grep -F 'name = "cryptography"' uv.lock >/dev/null
          grep -F 'version = "50.0.0"' uv.lock >/dev/null
          grep -F 'cryptography==50.0.0' requirements.lock >/dev/null
          grep -F 'cryptography==50.0.0' requirements-dev.txt >/dev/null
          test "$(grep -R -l 'cryptography==49.0.0' pyproject.toml uv.lock requirements.lock requirements-dev.txt | wc -l)" -eq 0

      - name: Verify the complete account-unification service
        working-directory: services/account_unification
        run: |
          set -euo pipefail
          uv sync --locked --extra dev
          uv run python - <<'PY'
          import cryptography
          from cryptography import x509

          assert cryptography.__version__ == "50.0.0"
          assert callable(x509.load_der_x509_certificate)
          PY
          uv run ruff check app tests tools
          uv run interrogate .
          uv run python -m compileall -q app tests tools
          uv run coverage erase
          uv run coverage run --branch --source=app -m pytest -q
          uv run coverage report --show-missing --fail-under=100
          uv build --out-dir dist

      - name: Verify deployment contracts
        env:
          IDP_DB_PASSWORD: ci-placeholder
          IDP_BOOTSTRAP_ADMIN_PASSWORD: ci-placeholder
        run: |
          set -euo pipefail
          python scripts/validate_realm.py deploy/keycloak/realm-cwl.json
          docker compose -f docker-compose.yml config >/dev/null
          python -m json.tool deploy/templates/saml-idp-employer-adfs.json >/dev/null
          git diff --check

      - name: Remove the one-shot upgrade workflow
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-upgrade-cryptography.yml
          git diff --check

      - name: Commit verified security upgrade
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::cryptography security upgrade produced no change.'
            exit 1
          fi
          git commit -m 'fix(security): upgrade cryptography to 50.0.0'
          git push origin HEAD:feat/federation-preflight-validation
