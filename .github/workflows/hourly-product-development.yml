name: Hourly product development

on:
  schedule:
    # Offset from the PR steward at minute 17 so merge evidence settles first.
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: keyverse-hourly-product-development
  cancel-in-progress: false

jobs:
  start-buyer-gap-task:
    name: Start one bounded buyer-gap task
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    env:
      TARGET_REPOSITORY: ContextualWisdomLab/keyverse
      BASE_BRANCH: main
      CORE_WORKFLOWS: '["ci","CodeQL","Security Scan","SAST Semgrep"]'
      CURRENT_RUN_ID: ${{ github.run_id }}
      AGENT_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
    steps:
      - name: Determine whether product development may start
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "eligible=false" >>"$GITHUB_OUTPUT"

          if [ -z "${AGENT_TOKEN:-}" ]; then
            echo "::warning::COPILOT_GITHUB_TOKEN is not configured; product development remains fail-closed."
            exit 0
          fi

          open_pr_file="${RUNNER_TEMP}/keyverse-open-pulls.json"
          if ! gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${TARGET_REPOSITORY}/pulls?state=open&per_page=1" \
            >"$open_pr_file"
          then
            echo "::warning::Unable to list open pull requests; refusing to create work."
            exit 0
          fi
          if ! open_pr_count="$(python3 - "$open_pr_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response_file:
              payload = json.load(response_file)
          if not isinstance(payload, list):
              raise SystemExit("Open-pull response is not a list")
          print(len(payload))
          PY
          )"
          then
            echo "::warning::Unable to interpret the open pull-request response; refusing to create work."
            exit 0
          fi
          if [ "$open_pr_count" -ne 0 ]; then
            echo "An open pull request already owns the development queue."
            exit 0
          fi

          if ! base_sha="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${TARGET_REPOSITORY}/commits/${BASE_BRANCH}" \
              --jq '.sha'
          )"
          then
            echo "::warning::Unable to resolve the default-branch head; refusing to create work."
            exit 0
          fi
          if [ -z "$base_sha" ]; then
            echo "::warning::The default-branch head was empty; refusing to create work."
            exit 0
          fi

          workflow_runs_file="${RUNNER_TEMP}/keyverse-main-workflow-runs.json"
          if ! gh api \
            -H "Accept: application/vnd.github+json" \
            --paginate \
            --slurp \
            "/repos/${TARGET_REPOSITORY}/actions/runs?branch=${BASE_BRANCH}&head_sha=${base_sha}&per_page=100" \
            >"$workflow_runs_file"
          then
            echo "::warning::Unable to read default-branch workflow evidence; refusing to create work."
            exit 0
          fi
          if ! python3 - "$workflow_runs_file" "$CORE_WORKFLOWS" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response_file:
              pages = json.load(response_file)
          required = set(json.loads(sys.argv[2]))
          if not isinstance(pages, list) or not required:
              raise SystemExit("Unsupported workflow-run response shape")

          runs = []
          for page in pages:
              if not isinstance(page, dict) or not isinstance(
                  page.get("workflow_runs"), list
              ):
                  raise SystemExit("Unsupported workflow-run response shape")
              runs.extend(page["workflow_runs"])

          latest = {}
          for run in runs:
              if not isinstance(run, dict):
                  continue
              name = run.get("name")
              run_id = run.get("id")
              if name not in required or not isinstance(run_id, int):
                  continue
              previous = latest.get(name)
              if previous is None or run_id > previous["id"]:
                  latest[name] = run

          missing = sorted(required.difference(latest))
          if missing:
              raise SystemExit(
                  "Missing required default-branch workflow evidence: "
                  + ", ".join(missing)
              )

          unhealthy = sorted(
              name
              for name, run in latest.items()
              if run.get("status") != "completed"
              or run.get("conclusion") != "success"
          )
          if unhealthy:
              raise SystemExit(
                  "Default branch has pending or unsuccessful required workflow evidence: "
                  + ", ".join(unhealthy)
              )
          PY
          then
            echo "::warning::Default-branch core workflow evidence is incomplete or unhealthy; refusing to create work."
            exit 0
          fi

          check_runs_file="${RUNNER_TEMP}/keyverse-main-check-runs.json"
          if ! gh api \
            -H "Accept: application/vnd.github+json" \
            --paginate \
            --slurp \
            "/repos/${TARGET_REPOSITORY}/commits/${base_sha}/check-runs?per_page=100" \
            >"$check_runs_file"
          then
            echo "::warning::Unable to read default-branch check evidence; refusing to create work."
            exit 0
          fi
          if ! python3 - "$check_runs_file" "$CURRENT_RUN_ID" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response_file:
              pages = json.load(response_file)
          current_run_fragment = f"/actions/runs/{sys.argv[2]}"
          if not isinstance(pages, list):
              raise SystemExit("Unsupported check-run response shape")

          checks = []
          for page in pages:
              if not isinstance(page, dict) or not isinstance(
                  page.get("check_runs"), list
              ):
                  raise SystemExit("Unsupported check-run response shape")
              checks.extend(page["check_runs"])

          latest = {}
          for check in checks:
              if not isinstance(check, dict):
                  continue
              details_url = check.get("details_url") or ""
              if current_run_fragment in details_url:
                  continue
              app = check.get("app") if isinstance(check.get("app"), dict) else {}
              key = (app.get("slug") or "unknown", check.get("name") or "")
              check_id = check.get("id")
              if not key[1] or not isinstance(check_id, int):
                  continue
              previous = latest.get(key)
              if previous is None or check_id > previous["id"]:
                  latest[key] = check

          if not latest:
              raise SystemExit("Missing latest default-branch check evidence")

          accepted_conclusions = {"success", "neutral", "skipped"}
          unhealthy = sorted(
              f"{key[0]}/{key[1]}"
              for key, check in latest.items()
              if check.get("status") != "completed"
              or check.get("conclusion") not in accepted_conclusions
          )
          if unhealthy:
              raise SystemExit(
                  "Default branch has pending or unsuccessful latest check evidence: "
                  + ", ".join(unhealthy)
              )
          PY
          then
            echo "::warning::Default-branch check evidence is incomplete or unhealthy; refusing to create work."
            exit 0
          fi

          tasks_file="${RUNNER_TEMP}/keyverse-agent-tasks.json"
          if ! GH_TOKEN="$AGENT_TOKEN" gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --paginate \
            --slurp \
            "/agents/repos/${TARGET_REPOSITORY}/tasks?per_page=100" \
            >"$tasks_file"
          then
            echo "::warning::Unable to list Copilot agent tasks; refusing to create another."
            exit 0
          fi
          if ! active_task_count="$(python3 - "$tasks_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response_file:
              payload = json.load(response_file)

          def extract_tasks(value):
              if isinstance(value, list):
                  if all(
                      isinstance(item, dict) and "state" in item
                      for item in value
                  ):
                      return value
                  extracted = []
                  for page in value:
                      page_tasks = extract_tasks(page)
                      if page_tasks is None:
                          return None
                      extracted.extend(page_tasks)
                  return extracted
              if isinstance(value, dict):
                  tasks_value = value.get("tasks", value.get("items"))
                  if isinstance(tasks_value, list):
                      return extract_tasks(tasks_value)
              return None

          tasks = extract_tasks(payload)
          if tasks is None:
              print("Unsupported agent-task response shape", file=sys.stderr)
              raise SystemExit(1)

          active_states = {"queued", "in_progress", "idle", "waiting_for_user"}
          terminal_states = {"completed", "failed", "timed_out", "cancelled"}
          active_count = 0
          for task in tasks:
              if not isinstance(task, dict):
                  active_count += 1
                  continue
              state = task.get("state")
              if state in active_states or state not in terminal_states:
                  active_count += 1
          print(active_count)
          PY
          )"
          then
            echo "::warning::Unable to interpret Copilot agent tasks; refusing to create another."
            exit 0
          fi
          if [ "$active_task_count" -ne 0 ]; then
            echo "A Copilot agent task already owns the development queue."
            exit 0
          fi

          echo "eligible=true" >>"$GITHUB_OUTPUT"

      - name: Start one bounded buyer-visible product task
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          prompt="$(cat <<'PROMPT'
          Continue commercializing ContextualWisdomLab/keyverse from the main branch.

          First inspect CLAUDE.md, README.md, CHANGELOG.md, open issues, recent
          commits, architecture and operations documentation, package boundaries,
          tests, security posture, Keycloak interoperability, and the complete
          administrator and end-user identity journey. Select exactly one
          highest-impact buyer-visible product gap that fits one bounded pull
          request. Do not create a new repository and do not broaden the slice
          merely to satisfy a valuation slogan.

          Follow Superpowers design, test-driven development, systematic debugging,
          and verification-before-completion. Write a failing behavior test before
          production code and verify that it fails for the intended missing
          capability. Use realistic identity-control-plane cases such as live-format
          OIDC/SAML/SCIM payloads, account-link or merge invariants, outage recovery,
          concurrency, migration, or deployment contracts as appropriate. Preserve
          100% production docstring coverage and 100% production statement and
          branch coverage on the exact final head.

          Keep Keyverse excellent both as a standalone service and as a CWL/Naruon
          module. Preserve passwordless-first behavior, verified-email linking,
          fail-closed federation and SCIM boundaries, deterministic auditability,
          minimal secret exposure, immutable release inputs, and two-word-or-longer
          snake_case database object names. When behavior is ambiguous, use the
          newest authoritative international standard or primary peer-reviewed
          research and record the references in APA 7th style in the relevant
          architecture, research, or operator documentation.

          Do not introduce an LLM merely to automate deterministic identity logic.
          If the selected buyer gap genuinely requires an LLM, integrate through
          contextual-orchestrator, use the NVIDIA_NIM_API_KEY GitHub secret for
          model-backed tests, keep provider-neutral contracts, and make offline and
          failure behavior explicit. Use Figma or Product Design only when the
          selected slice contains a real user interface; do not add cosmetic UI to
          an infrastructure-only feature.

          Update CHANGELOG.md, beginner-readable docstrings, operator guidance,
          testing evidence, and architecture documentation. Open exactly one focused
          draft pull request describing buyer impact, standards evidence, modularity,
          realistic tests, security boundaries, and exact verification. Do not merge
          your own pull request. Do not approve your own pull request. Do not bypass
          reviews or required checks. Do not publish a release. Release eligibility
          may be assessed only after protected merge and complete main-branch
          verification.
          PROMPT
          )"

          payload="$(
            jq -n \
              --arg prompt "$prompt" \
              --arg base_ref "$BASE_BRANCH" \
              '{prompt: $prompt, base_ref: $base_ref, create_pull_request: true}'
          )"
          response_file="${RUNNER_TEMP}/keyverse-created-agent-task.json"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/agents/repos/${TARGET_REPOSITORY}/tasks" \
            --input - \
            >"$response_file" \
            <<<"$payload"

          python3 - "$response_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response_file:
              task = json.load(response_file)
          task_id = task.get("id") if isinstance(task, dict) else None
          task_url = task.get("html_url") if isinstance(task, dict) else None
          task_state = task.get("state") if isinstance(task, dict) else None
          if not task_id or task_state not in {"queued", "in_progress", "idle"}:
              raise SystemExit("Agent Tasks API returned an unsupported creation response")
          print(f"Created one Keyverse product task {task_id}: {task_url or 'URL unavailable'}")
          PY
