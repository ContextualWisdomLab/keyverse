name: Materialize LDAP directory desired state

on:
  push:
    branches:
      - feat/ldap-directory-desired-state
    paths:
      - scripts/ci/materialize_ldap_directory_desired_state.py
      - .github/workflows/materialize-ldap-directory-desired-state.yml

permissions:
  contents: write

concurrency:
  group: materialize-ldap-directory-desired-state
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ldap-directory-desired-state
          fetch-depth: 0

      - name: Materialize the reviewed integration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/materialize_ldap_directory_desired_state.py
          python -m compileall -q \
            services/account_unification/app/directory_federation.py \
            services/account_unification/app/directory_federation_state.py \
            services/account_unification/app/product_keycloak_client.py \
            services/account_unification/tests/mock_product_keycloak.py

      - name: Remove the one-shot control files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/materialize-ldap-directory-desired-state.yml \
            scripts/ci/materialize_ldap_directory_desired_state.py

      - name: Commit the materialized tree
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "::error::The materializer produced no change."
            exit 1
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(directory): wire LDAP desired-state reconciliation"
          git push origin HEAD:feat/ldap-directory-desired-state
