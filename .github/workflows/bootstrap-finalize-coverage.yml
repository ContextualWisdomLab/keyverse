name: Bootstrap final locked coverage gate

on:
  push:
    branches:
      - feat/federation-preflight-validation
    paths:
      - .github/workflows/bootstrap-finalize-coverage.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-finalize-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.repository == 'ContextualWisdomLab/keyverse'
      && github.ref == 'refs/heads/feat/federation-preflight-validation'
      && github.actor == 'seonghobae'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/federation-preflight-validation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up package runner
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          prune-cache: true

      - name: Lock and export the coverage toolchain
        working-directory: services/account_unification
        run: |
          set -euo pipefail
          uv lock
          uv export \
            --format requirements-txt \
            --extra dev \
            --hashes \
            --no-emit-project \
            --output-file requirements-dev.txt
          grep -F 'coverage==7.14.3' requirements-dev.txt >/dev/null
          grep -F 'name = "coverage"' uv.lock >/dev/null

      - name: Verify the complete account-unification service
        working-directory: services/account_unification
        run: |
          set -euo pipefail
          uv sync --locked --extra dev
          uv run ruff check app tests tools
          uv run interrogate .
          uv run coverage erase
          uv run coverage run --branch --source=app -m pytest -q
          uv run coverage report --show-missing --fail-under=100

      - name: Verify deployment contracts
        env:
          IDP_DB_PASSWORD: ci-placeholder
          IDP_BOOTSTRAP_ADMIN_PASSWORD: ci-placeholder
        run: |
          set -euo pipefail
          python scripts/validate_realm.py deploy/keycloak/realm-cwl.json
          docker compose -f docker-compose.yml config >/dev/null
          python -m json.tool deploy/templates/saml-idp-employer-adfs.json >/dev/null

      - name: Remove one-shot measurement workflows
        run: |
          set -euo pipefail
          rm .github/workflows/measure-account-unification-coverage.yml
          rm .github/workflows/bootstrap-finalize-coverage.yml
          git diff --check

      - name: Commit the verified permanent gate
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::Final coverage materializer produced no change."
            exit 1
          fi
          git commit -m 'ci(coverage): enforce locked 100 percent production coverage'
          git push origin HEAD:feat/federation-preflight-validation
