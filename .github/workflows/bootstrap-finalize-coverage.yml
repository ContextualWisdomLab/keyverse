name: Bootstrap final locked coverage gate

on:
  push:
    branches:
      - feat/federation-preflight-validation
    paths:
      - .github/workflows/bootstrap-finalize-coverage.yml

permissions:
  contents: read

concurrency:
  group: bootstrap-finalize-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decommissioned:
    if: >-
      github.repository == 'ContextualWisdomLab/keyverse'
      && github.ref == 'refs/heads/feat/federation-preflight-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record safe decommissioning
        run: >-
          echo 'The write-capable branch materializer was superseded by reviewed,
          hash-pinned repository files and performs no mutation.'
