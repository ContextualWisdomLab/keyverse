name: Repair OIDC finalizer v4

on:
  push:
    branches:
      - feat/oidc-rp-client-preflight
    paths:
      - .github/workflows/one-shot-repair-oidc-finalizer-v4.yml

permissions:
  contents: read

concurrency:
  group: one-shot-finalize-oidc-rp-preflight
  cancel-in-progress: true

jobs:
  repair-and-retrigger:
    if: >-
      github.repository == 'ContextualWisdomLab/keyverse'
      && github.ref == 'refs/heads/feat/oidc-rp-client-preflight'
      && github.actor == 'seonghobae'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/oidc-rp-client-preflight
          fetch-depth: 0
          persist-credentials: true

      - name: Remove the unused-address defect from finalization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              '.github/workflows/one-shot-finalize-oidc-rp-preflight-v2.yml'
          )
          if path.exists():
              content = path.read_text(encoding='utf-8')
              anchor = "          module = module.replace(unreachable_ipv6, '')\n"
              addition = (
                  anchor
                  + "          module = module.replace(\n"
                  + "              '        address = ipaddress.ip_address(hostname)\\n',\n"
                  + "              '        ipaddress.ip_address(hostname)\\n',\n"
                  + "              1,\n"
                  + "          )\n"
              )
              if 'address = ipaddress.ip_address(hostname)' not in content:
                  if content.count(anchor) != 1:
                      raise SystemExit('OIDC finalizer module-rewrite anchor is missing')
                  content = content.replace(anchor, addition, 1)
                  path.write_text(content, encoding='utf-8')
          PY
          rm -f .github/workflows/one-shot-repair-oidc-finalizer-v4.yml
          git diff --check

      - name: Publish the corrected finalizer trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m 'ci: repair OIDC finalizer lint closure'
          git push origin HEAD:feat/oidc-rp-client-preflight
