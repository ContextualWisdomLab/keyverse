name: Repair account-unification regressions

on:
  push:
    branches:
      - fix/account-unification-ruff-lock-0.16.1
    paths:
      - .github/workflows/repair-account-unification-regressions.yml

permissions:
  contents: write

concurrency:
  group: repair-account-unification-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    name: Fix verified Keycloak and receipt regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # Required only for this isolated repair commit.
          ref: ${{ github.sha }}
      - name: Verify exact push head
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Apply the minimal verified repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          product_path = Path("services/account_unification/app/product_keycloak_client.py")
          product = product_path.read_text(encoding="utf-8")
          pattern_anchor = '''    ("identity-provider", "instances"),
              ("identity-provider", "instances", None),
          )'''.replace("              ", "    ")
          pattern_replacement = '''    ("identity-provider", "instances"),
              ("identity-provider", "instances", None),
              ("components",),
              ("components", None),
          )'''.replace("              ", "    ")
          if product.count(pattern_anchor) != 1:
              raise SystemExit("component allowlist anchor changed")
          product = product.replace(pattern_anchor, pattern_replacement)

          product = product.replace(
              '''# LDAP user-storage component transport. The methods deliberately reuse the
          # existing client, admin URL builder, and exact one-shot 401 reauthentication
          # boundary instead of creating a second token cache.'''.replace("          ", ""),
              '''# LDAP user-storage component transport. The methods deliberately reuse the
          # guarded Admin REST path boundary, bearer authentication, and exact one-shot
          # 401 reauthentication instead of creating a second transport or token cache.'''.replace("          ", ""),
          )

          replacements = {
              '''    response = self._send_with_reauth(
                  lambda: self._client.get(
                      self._admin_url("components"),
                      params={
                          "name": name,
                          "type": _DIRECTORY_COMPONENT_PROVIDER_TYPE,
                      },
                  )
              )'''.replace("              ", "    "): '''    path = self._guard_path(f"/admin/realms/{self._realm}/components")
              response = self._send_with_reauth(
                  lambda: self._client.get(
                      path,
                      params={
                          "name": name,
                          "type": _DIRECTORY_COMPONENT_PROVIDER_TYPE,
                      },
                      headers=self._auth_header(),
                  )
              )'''.replace("              ", "    "),
              '''    response = self._send_with_reauth(
                  lambda: self._client.post(
                      self._admin_url("components"),
                      json=payload,
                  )
              )'''.replace("              ", "    "): '''    path = self._guard_path(f"/admin/realms/{self._realm}/components")
              response = self._send_with_reauth(
                  lambda: self._client.post(
                      path,
                      json=payload,
                      headers=self._auth_header(),
                  )
              )'''.replace("              ", "    "),
              '''    self._send_with_reauth(
                  lambda: self._client.put(
                      self._admin_url(f"components/{safe_component_id}"),
                      json=payload,
                  )
              )'''.replace("              ", "    "): '''    path = self._guard_path(
                  f"/admin/realms/{self._realm}/components/{safe_component_id}"
              )
              self._send_with_reauth(
                  lambda: self._client.put(
                      path,
                      json=payload,
                      headers=self._auth_header(),
                  )
              )'''.replace("              ", "    "),
              '''    self._send_with_reauth(
                  lambda: self._client.delete(
                      self._admin_url(f"components/{safe_component_id}"),
                  )
              )'''.replace("              ", "    "): '''    path = self._guard_path(
                  f"/admin/realms/{self._realm}/components/{safe_component_id}"
              )
              self._send_with_reauth(
                  lambda: self._client.delete(
                      path,
                      headers=self._auth_header(),
                  )
              )'''.replace("              ", "    "),
          }
          for old, new in replacements.items():
              if product.count(old) != 1:
                  raise SystemExit(f"product transport anchor changed: {old.splitlines()[0]!r}")
              product = product.replace(old, new)
          product_path.write_text(product, encoding="utf-8")

          state_path = Path("services/account_unification/app/directory_federation_state.py")
          state = state_path.read_text(encoding="utf-8")
          if state.count("import hashlib\n") != 1:
              raise SystemExit("hashlib import anchor changed")
          state = state.replace("import hashlib\n", "import hashlib\nimport json\n")
          old_digest = '''    serialized = registration.model_dump_json(by_alias=True)
              return hashlib.sha256(serialized.encode("utf-8")).hexdigest()'''.replace("              ", "    ")
          new_digest = '''    serialized = json.dumps(
                  registration.model_dump(by_alias=True),
                  ensure_ascii=False,
                  separators=(",", ":"),
                  sort_keys=True,
              )
              return hashlib.sha256(serialized.encode("utf-8")).hexdigest()'''.replace("              ", "    ")
          if state.count(old_digest) != 1:
              raise SystemExit("desired digest anchor changed")
          state_path.write_text(state.replace(old_digest, new_digest), encoding="utf-8")

          test_path = Path("services/account_unification/tests/test_directory_component_transport.py")
          test_source = test_path.read_text(encoding="utf-8")
          test_source = test_source.replace(
              '''        self.requests: list[tuple[str, str, object | None]] = []
                  self.list_payload: object = []'''.replace("                  ", "        "),
              '''        self.requests: list[tuple[str, str, object | None]] = []
                  self.authorization_headers: list[dict[str, str]] = []
                  self.list_payload: object = []'''.replace("                  ", "        "),
          )
          method_replacements = {
              '''    def get(self, url: str, *, params: dict[str, str]) -> _FakeResponse:
                  """Record one list request."""
                  self.requests.append(("GET", url, dict(params)))'''.replace("                  ", "    "): '''    def get(
                  self,
                  url: str,
                  *,
                  params: dict[str, str],
                  headers: dict[str, str],
              ) -> _FakeResponse:
                  """Record one authenticated list request."""
                  self.requests.append(("GET", url, dict(params)))
                  self.authorization_headers.append(dict(headers))'''.replace("              ", "    "),
              '''    def post(self, url: str, *, json: dict) -> _FakeResponse:
                  """Record one create request."""
                  self.requests.append(("POST", url, dict(json)))'''.replace("                  ", "    "): '''    def post(
                  self,
                  url: str,
                  *,
                  json: dict,
                  headers: dict[str, str],
              ) -> _FakeResponse:
                  """Record one authenticated create request."""
                  self.requests.append(("POST", url, dict(json)))
                  self.authorization_headers.append(dict(headers))'''.replace("              ", "    "),
              '''    def put(self, url: str, *, json: dict) -> _FakeResponse:
                  """Record one replacement request."""
                  self.requests.append(("PUT", url, dict(json)))'''.replace("                  ", "    "): '''    def put(
                  self,
                  url: str,
                  *,
                  json: dict,
                  headers: dict[str, str],
              ) -> _FakeResponse:
                  """Record one authenticated replacement request."""
                  self.requests.append(("PUT", url, dict(json)))
                  self.authorization_headers.append(dict(headers))'''.replace("              ", "    "),
              '''    def delete(self, url: str) -> _FakeResponse:
                  """Record one delete request."""
                  self.requests.append(("DELETE", url, None))'''.replace("                  ", "    "): '''    def delete(
                  self,
                  url: str,
                  *,
                  headers: dict[str, str],
              ) -> _FakeResponse:
                  """Record one authenticated delete request."""
                  self.requests.append(("DELETE", url, None))
                  self.authorization_headers.append(dict(headers))'''.replace("              ", "    "),
          }
          for old, new in method_replacements.items():
              if test_source.count(old) != 1:
                  raise SystemExit(f"test transport anchor changed: {old.splitlines()[0]!r}")
              test_source = test_source.replace(old, new)
          fixture_anchor = '''    recorder = _RecordingClient()
              api._client = recorder  # type: ignore[assignment]'''.replace("              ", "    ")
          fixture_replacement = '''    recorder = _RecordingClient()
              api._token = "test-access-token"
              api._client = recorder  # type: ignore[assignment]'''.replace("              ", "    ")
          if test_source.count(fixture_anchor) != 1:
              raise SystemExit("test fixture anchor changed")
          test_source = test_source.replace(fixture_anchor, fixture_replacement)
          params_anchor = '''    assert params == {
                  "name": "corp-ldap",
                  "type": "org.keycloak.storage.UserStorageProvider",
              }'''.replace("              ", "    ")
          params_replacement = params_anchor + '''
              assert recorder.authorization_headers == [
                  {"Authorization": "Bearer test-access-token"}
              ]'''.replace("              ", "    ")
          if test_source.count(params_anchor) != 1:
              raise SystemExit("authorization assertion anchor changed")
          test_source = test_source.replace(params_anchor, params_replacement)
          mutation_anchor = '''    assert recorder.requests == [
                  (
                      "PUT",
                      "https://keycloak.internal/admin/realms/cwl/components/"
                      "directory-component-1",
                      payload,
                  ),
                  (
                      "DELETE",
                      "https://keycloak.internal/admin/realms/cwl/components/"
                      "directory-component-1",
                      None,
                  ),
              ]'''.replace("              ", "    ")
          mutation_replacement = mutation_anchor + '''
              assert recorder.authorization_headers == [
                  {"Authorization": "Bearer test-access-token"},
                  {"Authorization": "Bearer test-access-token"},
              ]'''.replace("              ", "    ")
          if test_source.count(mutation_anchor) != 1:
              raise SystemExit("mutation assertion anchor changed")
          test_path.write_text(
              test_source.replace(mutation_anchor, mutation_replacement),
              encoding="utf-8",
          )
          PY
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          prune-cache: true
      - name: Verify targeted regressions and complete quality gates
        working-directory: services/account_unification
        run: |
          uv sync --locked --extra dev
          uv run pytest -q \
            tests/test_directory_component_transport.py \
            tests/test_directory_federation_receipt.py
          uv run ruff check app tests tools
          uv run interrogate .
          uv run coverage run --branch --source=app -m pytest -q
          uv run coverage report --show-missing --fail-under=100
      - name: Verify patch integrity
        run: git diff --check
      - name: Publish the verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/account_unification/app/product_keycloak_client.py \
            services/account_unification/app/directory_federation_state.py \
            services/account_unification/tests/test_directory_component_transport.py
          git commit -m "fix(account-unification): restore directory convergence invariants"
          git push origin "HEAD:${GITHUB_REF_NAME}"
