name: Repair account-unification Ruff lock

on:
  push:
    branches:
      - fix/account-unification-ruff-lock-0.16.1
    paths:
      - services/account_unification/pyproject.toml
      - services/account_unification/uv.lock
      - .github/workflows/repair-account-unification-ruff-lock.yml

permissions:
  contents: write

concurrency:
  group: repair-account-unification-ruff-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate and verify uv.lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/account_unification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # Required only for this isolated repair commit.
          ref: ${{ github.sha }}
      - name: Verify exact push head
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
        working-directory: .
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true
      - name: Regenerate only the requested dependency
        run: uv lock --upgrade-package ruff
      - name: Verify the exact lock and environment
        run: |
          uv lock --check
          uv sync --locked --extra dev
          test "$(uv run ruff --version)" = "ruff 0.16.1"
      - name: Commit regenerated lock when changed
        run: |
          if git diff --quiet -- services/account_unification/uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/account_unification/uv.lock
          git commit -m "build(deps-dev): regenerate account-unification lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        working-directory: .
