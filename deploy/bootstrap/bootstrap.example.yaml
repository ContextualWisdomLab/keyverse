# Bootstrap pointer for the account-unification service.
#
# This file is configuration only. Its path is supplied through the non-secret
# CWL_IDP_BOOTSTRAP locator. It tells the service where its typed configuration
# store lives; it is not a credential authority and must contain no secret value.
#
# Copy to bootstrap.yaml and mount read-only at /bootstrap/bootstrap.yaml.
# The configuration namespace can contain endpoints, realm/client identifiers,
# policy choices and Keyverse secret references. Confidential values themselves
# are resolved through the Keyverse secret-lifecycle boundary as those released
# contracts become available.

config_store:
  # Supported standalone compatibility backend. Production deployments may ship
  # another reviewed adapter, but a backend must never silently fall back to
  # dotenv or a secret-valued environment blob.
  backend: sqlite

  sqlite:
    path: /bootstrap/idp_config_store.db

  # Reserved locator for a deployment-owned PostgreSQL configuration adapter.
  # dsn_secret_ref is an opaque Keyverse/external bootstrap reference, never a
  # DSN string. The standalone image does not currently ship that adapter.
  postgres:
    dsn_secret_ref: secret/idp/config-store-dsn

  namespace: account_unification
