{{- if and .Values.accountUnification.image.requireDigest (not .Values.accountUnification.image.digest) -}}
{{- fail "accountUnification.image.digest is required when accountUnification.image.requireDigest=true" -}}
{{- end -}}
{{- if .Values.accountUnification.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cwl-idp.fullname" . }}-account-unification-data
  namespace: {{ include "cwl-idp.namespace" . }}
  labels:
    {{- include "cwl-idp.labels" . | nindent 4 }}
    app.kubernetes.io/component: account-unification
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.accountUnification.persistence.storageClassName }}
  storageClassName: {{ .Values.accountUnification.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.accountUnification.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cwl-idp.fullname" . }}-account-unification
  namespace: {{ include "cwl-idp.namespace" . }}
  labels:
    {{- include "cwl-idp.labels" . | nindent 4 }}
    app.kubernetes.io/component: account-unification
spec:
  replicas: {{ .Values.accountUnification.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cwl-idp.name" . }}
      app.kubernetes.io/component: account-unification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cwl-idp.name" . }}
        app.kubernetes.io/component: account-unification
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: account-unification
          image: "{{ .Values.accountUnification.image.repository }}:{{ .Values.accountUnification.image.tag }}{{ if .Values.accountUnification.image.digest }}@{{ .Values.accountUnification.image.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.accountUnification.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8099
          env:
            - name: CWL_IDP_BOOTSTRAP
              value: "{{ .Values.accountUnification.bootstrap.mountPath }}/{{ .Values.accountUnification.bootstrap.fileName }}"
          volumeMounts:
            - name: bootstrap
              mountPath: {{ .Values.accountUnification.bootstrap.mountPath }}
              readOnly: true
            - name: account-unification-data
              mountPath: /var/lib/account-unification
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            {{- toYaml .Values.accountUnification.resources | nindent 12 }}
      volumes:
        - name: bootstrap
          secret:
            secretName: {{ .Values.accountUnification.bootstrap.secretName }}
        - name: account-unification-data
          {{- if .Values.accountUnification.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "cwl-idp.fullname" . }}-account-unification-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cwl-idp.fullname" . }}-account-unification
  namespace: {{ include "cwl-idp.namespace" . }}
  labels:
    {{- include "cwl-idp.labels" . | nindent 4 }}
    app.kubernetes.io/component: account-unification
spec:
  selector:
    app.kubernetes.io/name: {{ include "cwl-idp.name" . }}
    app.kubernetes.io/component: account-unification
  ports:
    - name: http
      port: {{ .Values.accountUnification.service.port }}
      targetPort: http
