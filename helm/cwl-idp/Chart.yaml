apiVersion: v2
name: cwl-idp
description: >-
  Ecosystem central IdP (Keycloak): passwordless OIDC + inbound ADFS/LDAP
  federation + a SCIM v2 shim + the account-unification admin service.
type: application
version: 0.2.0
appVersion: "0.2.0"

# Keycloak (Apache-2.0) and its Postgres (MIT) are templated directly by this
# chart (see templates/keycloak.yaml, templates/postgres.yaml) rather than
# pulled as a third-party subchart, so there is no external chart dependency to
# license-audit. Set keycloak.enabled=false to federate an externally-managed
# Keycloak instead.
