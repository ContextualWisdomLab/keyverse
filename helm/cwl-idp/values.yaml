# Values for the cwl-idp chart.

namespaceOverride: cwl-idp

# The account-unification admin service (this repo).
accountUnification:
  image:
    repository: cwl-idp/account-unification
    tag: "0.2.0"
    # Development may render a local tag. Production values must set
    # requireDigest=true and provide the built image's sha256 digest.
    digest: ""
    requireDigest: false
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 8099
  bootstrap:
    secretName: cwl-idp-bootstrap
    mountPath: /bootstrap
    fileName: bootstrap.yaml
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

keycloak:
  enabled: true
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.3.2"
    digest: "sha256:98fab020a3a490aba0978f237e2a06cd0ea42bf149c6cf10f11c0aaf27728ff2"
    pullPolicy: IfNotPresent
  replicaCount: 1
  hostname: "http://localhost:8080"
  hostnameStrict: false
  httpEnabled: true
  service:
    httpPort: 8080
    managementPort: 9000
  existingSecret: cwl-idp-keycloak
  realmImport:
    configMapName: cwl-idp-realm
    fileName: realm-cwl.json
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 2Gi

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine"
    digest: "sha256:67f624a4ad70edba8d65c82341124fab7054b277b4f7dea4b04be6f939ce2314"
    pullPolicy: IfNotPresent
  database: keycloak
  username: keycloak
  storage:
    size: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
