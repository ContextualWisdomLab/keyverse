# cwl-idp — ecosystem central IdP, standalone bring-up.
#
# Engine: Keycloak (Apache-2.0) + its own PostgreSQL (MIT).
# Images are pinned by tag AND digest for reproducibility.
#
# Runs standalone after a trusted supervisor/KMS adapter materializes the three
# root-bootstrap files under /run/keyverse-bootstrap. These files are the
# explicit self-bootstrap exception; ordinary CWL application secrets resolve
# through released Keyverse contracts and never through dotenv fallback.
#
# Readiness: Keycloak exposes a management port (9000) with /health/ready and
# /health/live when KC_HEALTH_ENABLED=true; deploy/scripts/healthz.sh and the
# compose healthchecks below poll it.

name: cwl-idp

services:
  idp_database:
    image: postgres:17-alpine@sha256:67f624a4ad70edba8d65c82341124fab7054b277b4f7dea4b04be6f939ce2314
    container_name: cwl_idp_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${IDP_DB_USER:-keycloak}
      POSTGRES_PASSWORD_FILE: /run/secrets/idp_database_password
      POSTGRES_DB: ${IDP_DB_NAME:-keycloak}
    secrets:
      - source: idp_database_password
        target: idp_database_password
    volumes:
      - idp_database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IDP_DB_USER:-keycloak} -d ${IDP_DB_NAME:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - idp_internal_network

  idp_engine:
    image: quay.io/keycloak/keycloak:26.3.2@sha256:98fab020a3a490aba0978f237e2a06cd0ea42bf149c6cf10f11c0aaf27728ff2
    container_name: cwl_idp_engine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/keycloak/bin/keyverse-secret-entrypoint.sh"]
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://idp_database:5432/${IDP_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${IDP_DB_USER:-keycloak}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${IDP_EXTERNAL_HOSTNAME:-http://localhost:8080}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_CACHE: ${IDP_CACHE_MODE:-local}
    secrets:
      - source: idp_database_password
        target: idp_database_password
      - source: idp_bootstrap_admin_username
        target: idp_bootstrap_admin_username
      - source: idp_bootstrap_admin_password
        target: idp_bootstrap_admin_password
    volumes:
      - ./deploy/keycloak/realm-cwl.json:/opt/keycloak/data/import/realm-cwl.json:ro
      - ./deploy/keycloak/secret-entrypoint.sh:/opt/keycloak/bin/keyverse-secret-entrypoint.sh:ro
    ports:
      - "${IDP_EXTERNAL_PORT:-8080}:8080"
    depends_on:
      idp_database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - idp_internal_network
      - idp_edge_network

  account_unification_service:
    build:
      context: ./services/account_unification
    image: cwl-idp/account-unification:local
    container_name: cwl_account_unification_service
    restart: unless-stopped
    environment:
      # This is a non-secret bootstrap locator only. Real configuration is read
      # from the mounted bootstrap descriptor/config store. The Key Vault root
      # itself moves to the protected bootstrap contract in the stacked owner PR.
      CWL_IDP_BOOTSTRAP: /bootstrap/bootstrap.yaml
    volumes:
      - ./deploy/bootstrap:/bootstrap:ro
      - account_unification_data:/var/lib/account-unification
    ports:
      - "${UNIFICATION_PORT:-8099}:8099"
    depends_on:
      idp_engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - idp_internal_network
      - idp_edge_network

# These are self-bootstrap inputs only. A trusted supervisor, host credential
# agent, or KMS/HSM integration must materialize them outside the repository.
# The fixed absolute path deliberately avoids Compose's implicit .env mechanism.
secrets:
  idp_database_password:
    file: /run/keyverse-bootstrap/idp_database_password
  idp_bootstrap_admin_username:
    file: /run/keyverse-bootstrap/idp_bootstrap_admin_username
  idp_bootstrap_admin_password:
    file: /run/keyverse-bootstrap/idp_bootstrap_admin_password

volumes:
  idp_database_data:
  account_unification_data:

networks:
  idp_internal_network:
    driver: bridge
  idp_edge_network:
    driver: bridge
