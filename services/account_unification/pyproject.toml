[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cwl-idp-account-unification"
version = "0.1.0"
description = "Account-unification admin service for cwl-idp (Keycloak)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "cryptography==50.0.0",
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = [
    "coverage==7.15.4",
    "httpx2==2.9.1",
    "interrogate==1.7.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
    "setuptools==84.0.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the classic default rule set (pyflakes + pycodestyle E4/E7/E9). ruff 0.16
# widened its implicit default to add flake8-bugbear/pyupgrade/etc.; this keeps
# the established lint policy explicit and stable across ruff upgrades.
select = ["E4", "E7", "E9", "F"]

[tool.interrogate]
exclude = ["tests", ".venv"]
fail-under = 100
