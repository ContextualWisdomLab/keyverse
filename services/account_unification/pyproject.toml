[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cwl-idp-account-unification"
version = "0.1.0"
description = "Account-unification admin service for cwl-idp (Keycloak)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi==0.139.0",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "uvicorn==0.50.2",
]

[project.optional-dependencies]
dev = [
    "interrogate==1.7.0",
    "pytest==9.1.1",
    "ruff==0.15.20",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.interrogate]
exclude = ["tests", ".venv"]
fail-under = 80
